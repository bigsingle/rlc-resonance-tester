<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RLC Resonance Measurer</title>
  <style>
    body { font-family: sans-serif; text-align: center; background: #f4f4f9; padding: 20px; }
    canvas { background: #111; border-radius: 8px; width: 100%; max-width: 600px; height: 300px; }
    button { font-size: 1.1rem; padding: 10px 20px; margin: 10px; cursor: pointer; }
  </style>
</head>
<body>
  <h2>RLC直列回路 共振特性測定器</h2>
  <button id="startBtn">測定開始 (1kHz - 10kHz スイープ)</button>
  <br>
  <canvas id="chartCanvas"></canvas>

  <script>
    const startBtn = document.getElementById('startBtn');
    const canvas = document.getElementById('chartCanvas');
    const ctx = canvas.getContext('2d');
    
    // Canvas解像度設定
    canvas.width = 600;
    canvas.height = 300;

    startBtn.addEventListener('click', async () => {
      startBtn.disabled = true;
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      
      // 1. マイク入力の取得設定
      const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false } });
      const micInput = audioCtx.createMediaStreamSource(stream);
      const analyser = audioCtx.createAnalyser();
      analyser.fftSize = 2048;
      micInput.connect(analyser);

      // 2. 正弦波発振器の設定
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      gain.gain.value = 0.8; // 出力振幅 (過大出力回避)
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      // 3. スイープ測定処理
      const startFreq = 1000; // 1kHz
      const endFreq = 10000;   // 10kHz
      const steps = 100;
      const stepDuration = 50; // 1ステップあたりのミリ秒
      
      const plotData = [];
      const timeData = new Float32Array(analyser.fftSize);

      osc.start();

      for (let i = 0; i <= steps; i++) {
        const freq = startFreq + (endFreq - startFreq) * (i / steps);
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        
        await new Promise(r => setTimeout(r, stepDuration));

        // 波形データから実効値(振幅)を算出
        analyser.getFloatTimeDomainData(timeData);
        let sumSquares = 0;
        for (let j = 0; j < timeData.length; j++) {
          sumSquares += timeData[j] * timeData[j];
        }
        const rms = Math.sqrt(sumSquares / timeData.length);
        plotData.push({ freq, rms });

        // リアルタイム描画
        drawChart(plotData, startFreq, endFreq);
      }

      osc.stop();
      startBtn.disabled = false;
    });

    function drawChart(data, minF, maxF) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = '#00ffcc';
      ctx.lineWidth = 2;
      ctx.beginPath();

      const maxRms = Math.max(...data.map(d => d.rms), 0.01);

      data.forEach((pt, index) => {
        const x = ((pt.freq - minF) / (maxF - minF)) * canvas.width;
        const y = canvas.height - (pt.rms / maxRms) * (canvas.height - 40) - 20;
        if (index === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.stroke();
    }
  </script>
</body>
</html>
